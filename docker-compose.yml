name: favorite-cms

services:
  backend:
    image: python:3.12-slim
    working_dir: /workspace
    command: sh -c "pip install -e . && uvicorn backend.main:app --host 0.0.0.0 --port 8000"
    environment:
      FAVORITE_ENV: development
      FAVORITE_DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace

  frontend:
    image: node:22-alpine
    working_dir: /workspace/frontend
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_FAVORITE_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
    depends_on:
      - backend

